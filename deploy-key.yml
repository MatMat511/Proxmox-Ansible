---
- name: Déployer une clé publique SSH
  hosts: nodes
  become: true


  vars:
    ssh_user: user
    ssh_key: "{{ lookup('file', 'files/id_ed25519.pub') }}"


  tasks:
    - name: Contrôle dossier ssh
      file:
        path: "/home/{{ ssh_user }}/.ssh"
        state: directory
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: '0700'

    - name: Ajoute la clé SSH dans ‘authorized_keys’
      authorized_key:
        user: "{{ ssh_user }}"
        key: "{{ ssh_key }}"
        state: present

    - name: Désactiver l'authentification par mot de passe SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: restart ssh

  handlers:
    - name: restart ssh
      service:
        name: sshd
        state: restarted
